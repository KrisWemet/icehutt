name: Generate AI images

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'main']
    paths:
      - 'images/prompts.json'
      - 'scripts/generate-images.sh'
      - '.github/workflows/generate-images.yml'

permissions:
  contents: write

concurrency:
  group: generate-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate images with Pollinations.ai (Flux)
        run: bash scripts/generate-images.sh

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Regenerate AI imagery from images/prompts.json"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
