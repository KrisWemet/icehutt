<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FF5D8F" />
  <!-- Staff tool: never index this, and don't follow links off it. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Flavour Board · Staff · The Ice Hut</title>

  <link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="admin-header">
    <div class="admin-wrap admin-bar">
      <a class="admin-brand" href="index.html">
        <span class="cone-mark" aria-hidden="true">🍦</span>
        <span>Flavour Board</span>
      </a>
      <div class="admin-who" id="who" hidden>
        <span id="whoEmail"></span>
        <button type="button" class="btn-plain" id="signOut">Sign out</button>
      </div>
    </div>
  </header>

  <main class="admin-wrap">

    <!-- ============ Signed out ============ -->
    <section id="loginView" hidden>
      <form class="login-card" id="loginForm">
        <h1>Staff sign in</h1>
        <p class="login-sub">Set which flavours are in stock. Changes show on the website right away.</p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />

        <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
        <p class="form-error" id="loginError" role="alert" hidden></p>
      </form>
    </section>

    <!-- ============ Signed in ============ -->
    <section id="boardView" hidden>
      <div class="board-head">
        <h1>Today's board</h1>
        <p class="board-sub">Everything starts as <strong>In stock</strong>. Just tap the ones that are running low or have run out — the website updates within seconds.</p>
      </div>

      <div class="board-controls">
        <label class="search-field">
          <span class="visually-hidden">Search flavours</span>
          <input type="search" id="search" placeholder="Search flavours…" autocomplete="off" />
        </label>
        <div class="filter-chips" role="group" aria-label="Filter by status">
          <button type="button" class="chip is-active" data-filter="all">All <span class="chip-count" id="countAll">0</span></button>
          <button type="button" class="chip" data-filter="getting_low">Getting low <span class="chip-count" id="countLow">0</span></button>
          <button type="button" class="chip" data-filter="out_of_stock">Out <span class="chip-count" id="countOut">0</span></button>
        </div>
      </div>

      <p class="save-state" id="saveState" role="status" aria-live="polite"></p>

      <ul class="flavour-rows" id="rows"></ul>
      <p class="empty-note" id="emptyNote" hidden>No flavours match that search.</p>

      <div class="board-footer">
        <button type="button" class="btn-plain danger" id="resetAll">Reset everything to “In stock”</button>
      </div>
    </section>

    <p class="boot-note" id="bootNote">Loading…</p>
  </main>

  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
